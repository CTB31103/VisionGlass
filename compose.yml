services:
  cloudflare:
    image: cloudflare/cloudflared${CLOUDFLARE_VERSION}
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TOKEN}
    restart: unless-stopped
    profiles: [prod, prod-host, prod-app-host]
    networks:
      web-network:
  # ===========================
  # Front End
  # ===========================
  prod-ui:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: runner
      args:
        - PORT=${PROD_FE_PORT}
        - VITE_API_URL=https://${DOMAIN_NAME}
        - VITE_SERVER_API_KEY=${SERVER_API_KEY}
        - VITE_GOOGLE_CAPTCHA_SITE_KEY=${VITE_GOOGLE_CAPTCHA_SITE_KEY}
        - VITE_GOOGLE_CAPTCHA_SECRET_KEY=${VITE_GOOGLE_CAPTCHA_SECRET_KEY}
    ports:
      - "${PROD_FE_PORT}:${PROD_FE_PORT}"
    depends_on:
      cloudflare:
        condition: service_healthy
        required: false
    profiles: [prod, prod-app, prod-app-host]
    networks:
      web-network:
  dev-ui:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    ports:
      - "${DEV_FE_PORT}:${DEV_FE_PORT}"
    env_file:
      - .env
    environment:
      - PORT=${DEV_FE_PORT}
      - VITE_API_URL=http://localhost:${DEV_BE_PORT}
      - VITE_SERVER_API_KEY=${SERVER_API_KEY}
      - HOST=0.0.0.0
      - WDS_SOCKET_PORT=0
    profiles: [dev]
    stdin_open: true
    tty: true
    networks:
      web-network:
    develop:
      watch:
        - action: sync
          path: ./client/src
          target: ./app/src
          ignore:
            - node_modules/
        - action: rebuild
          path: ./client/package.json
          target: /app/package.json
        - action: rebuild
          path: ./client/vite.config.ts
          target: /app/vite.config.ts
  # ===========================
  # Back End
  # ===========================
  prod-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "${PROD_BE_PORT}:${PROD_BE_PORT}"
    env_file:
      - .env
    environment:
      - PORT=${PROD_BE_PORT}
      - NODE_ENV=prod
      - API_URL=https://${DOMAIN_NAME}/api
      - CLIENT_URL=https://${DOMAIN_NAME}
      - MONGO_URL=mongodb://primary:${MONGO_PORT}/${MONGO_DATABASE_NAME}?authSource=admin&
    depends_on:
      prod-ui:
        condition: service_started
        required: true
      setup-replica:
        condition: service_completed_successfully
        required: false
    volumes:
      - ./server/src/uploads/public:/app/dist/uploads/public
    profiles: [prod, prod-app, prod-app-host]
    networks:
      web-network:
  dev-server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    ports:
      - "${DEV_BE_PORT}:${DEV_BE_PORT}"
    env_file:
      - .env
    environment:
      - PORT=${DEV_BE_PORT}
      - NODE_ENV=dev
      - API_URL=http://localhost:${DEV_BE_PORT}
      - CLIENT_URL=http://localhost:${DEV_FE_PORT}
      - MONGO_URL=mongodb://primary:${MONGO_PORT}/${MONGO_DATABASE_NAME}?authSource=admin&
    volumes:
      - ./server/src/uploads/test:/app/src/uploads/test
    profiles: [dev]
    stdin_open: true
    tty: true
    networks:
      web-network:
    develop:
      watch:
        - action: sync
          path: ./server/src
          target: ./app/src
          ignore:
            - node_modules/
        - action: rebuild
          path: ./server/package.json
          target: /app/package.json
  # ===========================
  # Database
  # ===========================
  primary:
    hostname: primary
    container_name: primary
    build:
      context: ./mongodb/primary
      args:
        - MONGO_IMAGE_VERSION=${MONGO_IMAGE_VERSION}
    volumes:
      - ./mongodb/data/primary:/data/db
    depends_on:
      - secondary-1
      - secondary-2
    environment:
      - MONGO_REPL_NAME=${MONGO_REPL_NAME}
      - MONGO_PORT=${MONGO_PORT}
    command: ["--oplogSize", "1024", "--replSet", "${MONGO_REPL_NAME}"]
    networks:
      mongodb_network:
      web-network:
    profiles: ["prod", "dev", prod-db, dev-db, "db"]
  secondary-1:
    image: mongo${MONGO_IMAGE_VERSION}
    hostname: secondary-1
    container_name: secondary-1
    command: --replSet ${MONGO_REPL_NAME} --oplogSize 128
    environment:
      - MONGO_REPL_NAME=${MONGO_REPL_NAME}
    volumes:
      - ./mongodb/data/secondary-1:/data/db
    networks:
      mongodb_network:
    profiles: ["prod", "dev", prod-db, dev-db, "db"]
  secondary-2:
    image: mongo${MONGO_IMAGE_VERSION}
    hostname: secondary-2
    container_name: secondary-2
    command: --replSet ${MONGO_REPL_NAME} --oplogSize 128
    environment:
      - MONGO_REPL_NAME=${MONGO_REPL_NAME}
    volumes:
      - ./mongodb/data/secondary-2:/data/db
    networks:
      mongodb_network:
    profiles: ["prod", "dev", prod-db, dev-db, "db"]
  setup-replica:
    hostname: setup-replica
    container_name: setup-replica
    build:
      context: ./mongodb/setup
      args:
        - MONGO_IMAGE_VERSION=${MONGO_IMAGE_VERSION}
    depends_on:
      - primary
    environment:
      - MONGO_REPL_NAME=${MONGO_REPL_NAME}
      - MONGO_PORT=${MONGO_PORT}
    networks:
      mongodb_network:
    profiles: ["prod", "dev", prod-db, dev-db, "db"]

networks:
  web-network:
    driver: bridge
  mongodb_network:
    driver: bridge

name: VisionGlass - CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Setup Tailscale
        uses: tailscale/github-action@v2
        with:
          hostname: Github-actions
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Execute SSH commands using password
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: "pwd; cd .\\Programming\\VisionGlass; git -c credential.helper='!f() { echo \"username=${{ secrets.GIT_UNAME }}\"; echo \"password=${{ secrets.GIT_PWD }}\"; }; f' pull; git checkout main; git pull; docker compose down; docker compose build --no-cache; docker compose up -d; exit"

